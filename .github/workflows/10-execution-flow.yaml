name : 10 - execution flows
on : 
    workflow_dispatch:
        inputs :
            pass-unit-tests:
                description : Enable pass test
                type: boolean
                default : false
jobs : 
    build : 
        runs-on : ubuntu-latest
        steps : 
            - name : Building projet
              run : echo "building project"
    unit-test :
        runs-on : ubuntu-latest
        steps : 
            - name : Running unit tests
              run : echo "Running unit tests"
            - name : Failing tests
              if : ${{! inputs.pass-unit-tests}}
              run : exit 1
    deploy-nonprod:
        runs-on : ubuntu-latest
        needs: 
            - build
            - unit-test
        steps : 
            - name : Deploying project
              run : echo "Deploying project ... "
    e2e-tests: 
        runs-on : ubuntu-latest
        needs : 
            - deploy-nonprod
        steps : 
            - name : Running E2E tests
              run : echo "Running E2E test ...."
    deploy-prod:
        runs-on : ubuntu-latest
        needs : 
            - deploy-nonprod
        steps : 
            - name : Deploying project
              run : echo "Deploying project ...."
    
