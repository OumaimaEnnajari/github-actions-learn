name : 12- outputs workflow

on :
    workflow_dispatch:
        inputs:
            status:
                type: choice
                options:
                    - succeed
                    - failure
                description: Build status ?
                required: true

jobs:
    build:
        runs-on : ubuntu-latest
        outputs:
            build-status : ${{steps.build.outputs.status}}
        steps:
            - name : Print GITHUB_OUTPUT path
              run : echo "$GITHUB_OUTPUT"

            - name : Build
              id : build
              run : | 
                echo "status=${{inputs.status}}" >> "$GITHUB_OUTPUT"
                echo "var1=value1" >> "$GITHUB_OUTPUT"
                cat "$GITHUB_OUTPUT"
                

    deploy:
        runs-on : ubuntu-latest
        needs: build
        if : ${{needs.build.outputs.build-status == 'succeed'}}
        steps :
            - name : Deploy
              run : echo "Deploying project .... "
